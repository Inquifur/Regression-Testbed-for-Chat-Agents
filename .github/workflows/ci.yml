name: chatreg

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run behavioral tests
        run: python -m pytest
      - name: Validate example scenarios
        run: python -m chatreg validate examples
      - name: Run example scenarios
        run: python -m chatreg run examples --adapter demo --report artifacts/report.json --baseline-dir artifacts/demo-baseline
      - name: Verify demo implementation fault detection and recovery
        run: python tools/verify_faults.py --adapter demo --output-dir artifacts/demo-fault
      - name: Explain private integration scope
        run: python -c "print('Private QQAgent integration NOT RUN in public CI; provide CHATREG_QQAGENT_ROOT and its dependencies to run locally.')"
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatreg-report-${{ matrix.os }}
          path: |
            artifacts/report.json
            artifacts/demo-baseline
            artifacts/demo-fault
          if-no-files-found: warn
